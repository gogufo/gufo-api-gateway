syntax = "proto3";

package gufo;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./;proto";

// ============================================================
// Gufo Core Transport (Dynamic Execution Bus)
// ============================================================
// - Keeps URL structure compatibility:
//   /api/v1/{module}/{param}/{param_id}/{param_idd}
// - Supports HTTP + gRPC
// - Separates routing, query, and body
// ============================================================

service Reverse {
  rpc Do(Request) returns (Response);
  rpc Stream(stream Request) returns (stream Response);
}

// ============================================================
// Request
// ============================================================

message Request {

  // -------- Routing (from URL) --------

  // Microservice name
  string module = 1;

  // Resource / handler
  string param = 2;

  // Primary identifier
  string param_id = 3;

  // Secondary identifier
  string param_idd = 4;

  // Optional action
  string action = 5;

  // -------- Query (GET parameters) --------

  // Example: ?limit=10&search=alex
  map<string, string> query = 6;

  // -------- Body (POST/PUT/PATCH payload) --------

  // Typed payload (protobuf recommended)
  google.protobuf.Any body = 7;

  // -------- HTTP Metadata --------

  string path = 8;

  Method method = 9;

  // -------- Auth --------

  AuthContext auth = 10;

  // -------- Context --------

  RequestContext context = 11;

  // -------- Files --------

  FileUpload file = 12;

  repeated FileRef files = 13;
}

// ============================================================
// Auth Context
// ============================================================

message AuthContext {

  string token = 1;
  string token_type = 2;
  string sid = 3;
  string uid = 4;
  string sign = 5;

  bool is_admin = 6;
  bool readonly = 7;

  int64 session_end = 8;

  map<string, string> meta = 9;
}

// ============================================================
// Request Context
// ============================================================

message RequestContext {

  string ip = 1;
  string user_agent = 2;
  string language = 3;
  string api_version = 4;

  int64 timestamp = 5;

  string trace_id = 6;
  string request_id = 7;

  string caller = 8;

  map<string, string> meta = 9;
}

// ============================================================
// File Upload
// ============================================================

message FileUpload {
  bytes data = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
}

message FileRef {
  string name = 1;
  string uri = 2;
}

// ============================================================
// Response
// ============================================================

message Response {

  // Main response payload
  map<string, google.protobuf.Any> data = 1;

  // Error object
  Error error = 2;

  // Metadata
  ResponseMeta meta = 3;

  // Upload result
  UploadStatusCode code = 4;

  // Optional debug echo
  Request request_back = 5;
}

// ============================================================
// Error
// ============================================================

message Error {

  int32 code = 1;
  string key = 2;
  string message = 3;

  map<string, string> meta = 4;

  bool retryable = 5;
}

// ============================================================
// Response Metadata
// ============================================================

message ResponseMeta {

  int32 status = 1;

  string trace_id = 2;
  string request_id = 3;

  string node = 4;

  google.protobuf.Timestamp ts = 5;

  map<string, string> extra = 6;
}

// ============================================================
// Streaming
// ============================================================

message FileChunk {
  string name = 1;
  bytes data = 2;
}

// ============================================================
// Upload Status
// ============================================================

enum UploadStatusCode {
  UPLOAD_STATUS_UNKNOWN = 0;
  UPLOAD_STATUS_OK = 1;
  UPLOAD_STATUS_FAILED = 2;
}

// ============================================================
// Method Enum
// ============================================================

enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_GET = 1;
  METHOD_POST = 2;
  METHOD_PUT = 3;
  METHOD_PATCH = 4;
  METHOD_DELETE = 5;
}